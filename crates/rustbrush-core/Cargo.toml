[package]
name = "rustbrush-core"
version = "0.2.0"
edition = "2021"
description = "Core library for RustBrush: color science, image processing, paint planning"
license = "MIT"

[features]
default = ["update-check"]
update-check = ["ureq"]

[dependencies]
image = "0.25"
palette = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
imageproc = "0.25"
ureq = { version = "3", optional = true }

[dev-dependencies]
